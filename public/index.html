<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart PDF Splitter Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
      }
      .drag-active {
        border-color: #3b82f6 !important;
        background-color: rgba(59, 130, 246, 0.1);
      }
      .loader {
        border: 3px solid #f3f3f3;
        border-radius: 50%;
        border-top: 3px solid #3b82f6;
        width: 22px;
        height: 22px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">
    <!-- Toast Notification -->
    <div
      id="toast"
      class="fixed top-5 right-5 hidden bg-red-600 text-white px-5 py-3 rounded-lg shadow-lg transition-all duration-300 z-50 text-sm font-medium"
    ></div>

    <div class="bg-gray-800 border border-gray-700 rounded-2xl shadow-2xl p-8 w-full max-w-lg">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-blue-400 mb-2">Smart PDF Splitter</h1>
        <p class="text-gray-400 text-sm">Upload, split by count or range, and download as ZIP.</p>
      </div>

      <form id="pdfForm" class="space-y-6">
        <!-- Drag and Drop Area -->
        <div
          id="dropzone"
          class="border-2 border-dashed border-gray-600 rounded-xl p-8 text-center cursor-pointer transition-all duration-200 hover:border-blue-500"
        >
          <input type="file" id="pdfFile" accept="application/pdf" class="hidden" required />
          <div class="text-gray-400">
            <svg class="mx-auto h-12 w-12 mb-3 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
              />
            </svg>
            <span id="fileName" class="block font-medium text-gray-200">Click to upload or drag & drop</span>
            <span id="fileInfo" class="text-xs text-gray-500 mt-1 block">PDF files only</span>
          </div>
        </div>

        <!-- Split Mode Selection -->
        <div>
          <label class="block text-sm font-medium mb-2">Split Mode</label>
          <select
            id="splitMode"
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
          >
            <option value="byPages">Split every X pages</option>
            <option value="byFiles">Split into X equal files</option>
            <option value="customRange">Custom page range (e.g. 1-3, 5, 8-10)</option>
          </select>
        </div>

        <!-- Dynamic Input Fields -->
        <div id="numericValueGroup">
          <label class="block text-sm font-medium mb-2" id="valueLabel">Pages per file (X)</label>
          <input
            type="number"
            id="splitValue"
            min="1"
            value="1"
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
          />
        </div>

        <div id="customRangeGroup" class="hidden">
          <label class="block text-sm font-medium mb-2">Page Selection</label>
          <input
            type="text"
            id="customRange"
            placeholder="e.g. 1-4, 7, 10-12"
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
          />
        </div>

        <!-- File Naming Pattern -->
        <div>
          <label class="block text-sm font-medium mb-1">Output Naming Pattern (Optional)</label>
          <input
            type="text"
            id="outputName"
            placeholder="e.g. Document_$X or Chapter"
            class="w-full bg-gray-700 border border-gray-600 rounded-lg px-4 py-2.5 text-gray-100 focus:ring-2 focus:ring-blue-500 outline-none"
          />
          <p class="text-xs text-gray-400 mt-1">
            Use <code class="bg-gray-700 text-blue-400 px-1 rounded">$X</code> for index (e.g.
            <code class="text-gray-300">Doc_$X</code> &rarr; <code class="text-gray-300">Doc_1.pdf</code>). Defaults to
            original file name.
          </p>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          id="submitBtn"
          class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex items-center justify-center gap-2 transition-colors"
        >
          <span id="btnText">Split PDF Now</span>
          <div id="btnLoader" class="loader hidden"></div>
        </button>
      </form>
    </div>

    <script>
      const dropzone = document.getElementById('dropzone');
      const fileInput = document.getElementById('pdfFile');
      const fileName = document.getElementById('fileName');
      const fileInfo = document.getElementById('fileInfo');
      const splitMode = document.getElementById('splitMode');
      const numericValueGroup = document.getElementById('numericValueGroup');
      const customRangeGroup = document.getElementById('customRangeGroup');
      const valueLabel = document.getElementById('valueLabel');
      const form = document.getElementById('pdfForm');
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnLoader = document.getElementById('btnLoader');
      const toast = document.getElementById('toast');

      function showToast(message) {
        toast.textContent = message;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 4000);
      }

      splitMode.addEventListener('change', () => {
        const mode = splitMode.value;
        if (mode === 'customRange') {
          numericValueGroup.classList.add('hidden');
          customRangeGroup.classList.remove('hidden');
        } else {
          numericValueGroup.classList.remove('hidden');
          customRangeGroup.classList.add('hidden');
          valueLabel.textContent = mode === 'byPages' ? 'Pages per file (X)' : 'Number of output files (X)';
        }
      });

      function handleFile(file) {
        if (file && file.type === 'application/pdf') {
          const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
          fileName.textContent = file.name;
          fileInfo.textContent = `Size: ${sizeMB} MB`;
        } else {
          showToast('Please select a valid PDF file.');
        }
      }

      dropzone.addEventListener('click', () => fileInput.click());
      dropzone.addEventListener('dragover', e => {
        e.preventDefault();
        dropzone.classList.add('drag-active');
      });
      dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-active'));
      dropzone.addEventListener('drop', e => {
        e.preventDefault();
        dropzone.classList.remove('drag-active');
        if (e.dataTransfer.files.length) {
          fileInput.files = e.dataTransfer.files;
          handleFile(fileInput.files[0]);
        }
      });

      fileInput.addEventListener('change', () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
      });

      form.addEventListener('submit', async e => {
        e.preventDefault();
        if (!fileInput.files[0]) return showToast('Please select a PDF file first.');

        const formData = new FormData();
        formData.append('pdfFile', fileInput.files[0]);
        formData.append('splitMode', splitMode.value);
        formData.append('splitValue', document.getElementById('splitValue').value);
        formData.append('customRange', document.getElementById('customRange').value);
        formData.append('outputName', document.getElementById('outputName').value);

        btnText.textContent = 'Processing...';
        btnLoader.classList.remove('hidden');
        submitBtn.disabled = true;

        try {
          const response = await fetch('/api/split', { method: 'POST', body: formData });

          if (!response.ok) {
            const data = await response.json().catch(() => ({}));
            throw new Error(data.error || 'Server processing error.');
          }

          const blob = await response.blob();
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `Split_${fileInput.files[0].name.replace('.pdf', '')}.zip`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        } catch (error) {
          showToast(error.message);
        } finally {
          btnText.textContent = 'Split PDF Now';
          btnLoader.classList.add('hidden');
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
